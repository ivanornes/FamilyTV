<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4a4a56"/>
      <stop offset="1" stop-color="#0c0c11"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.15" cy="1" r="0.6">
      <stop offset="0" stop-color="#7d8cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7d8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050507"/>
      <stop offset=".5" stop-color="#1b1b22"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a66"/>
      <stop offset=".55" stop-color="#1c1c23"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e8e96"/>
      <stop offset=".35" stop-color="#f2f2f5"/>
      <stop offset=".6" stop-color="#c9c9cf"/>
      <stop offset="1" stop-color="#7b7b84"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="680" height="336" fill="url(#bg)"/>
  <rect width="680" height="336" fill="url(#spot)"/>
  <rect width="680" height="336" fill="url(#rim)"/>

  <!-- Sombra en el suelo -->
  <ellipse cx="320" cy="262" rx="170" ry="26" fill="#000" opacity=".7" filter="url(#soft)"/>
  <ellipse cx="520" cy="280" rx="70" ry="10" fill="#000" opacity=".6" filter="url(#soft)"/>

  <!-- Caja de streaming (puck cuadrado redondeado en 3/4) -->
  <g>
    <!-- lateral -->
    <path d="M182 160 v58 c0 22 46 36 138 36 s138 -14 138 -36 v-58 z" fill="url(#side)"/>
    <!-- base del lateral con canto -->
    <path d="M182 214 c0 22 46 36 138 36 s138 -14 138 -36" fill="none" stroke="#2c2c34" stroke-width="2"/>
    <!-- tapa -->
    <path d="M182 160 c0 -26 46 -48 138 -48 s138 22 138 48 c0 26 -46 46 -138 46 s-138 -20 -138 -46 z" fill="url(#top)"/>
    <!-- reflejo de la tapa -->
    <path d="M206 150 c10 -20 52 -32 114 -32 s96 8 112 22 c-30 -6 -70 -10 -112 -10 s-86 8 -114 20 z" fill="url(#gloss)" opacity=".55"/>
    <!-- borde iluminado -->
    <path d="M182 160 c0 -26 46 -48 138 -48 s138 22 138 48" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <!-- LED de estado -->
    <circle cx="320" cy="236" r="3.2" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="320" cy="236" r="2" fill="#ffffff"/>
  </g>

  <!-- Mando a distancia inclinado -->
  <g transform="translate(520 176) rotate(-16)">
    <rect x="-26" y="-118" width="52" height="236" rx="24" fill="url(#alu)"/>
    <rect x="-26" y="-118" width="52" height="236" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.5"/>
    <!-- superficie táctil -->
    <circle cx="0" cy="-74" r="21" fill="url(#glass)"/>
    <circle cx="0" cy="-74" r="21" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="0" cy="-74" r="7" fill="#1d1d23"/>
    <!-- botones -->
    <circle cx="-11" cy="-30" r="8" fill="#1a1a1f"/>
    <circle cx="11" cy="-30" r="8" fill="#1a1a1f"/>
    <circle cx="-11" cy="-6" r="8" fill="#1a1a1f"/>
    <rect x="3" y="-14" width="16" height="44" rx="8" fill="#1a1a1f"/>
    <circle cx="-11" cy="18" r="8" fill="#1a1a1f"/>
    <!-- brillo lateral -->
    <rect x="-20" y="-110" width="6" height="220" rx="3" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- destellos -->
  <g fill="#ffffff">
    <circle cx="96" cy="70" r="1.6" opacity=".7"/>
    <circle cx="610" cy="56" r="1.4" opacity=".6"/>
    <circle cx="150" cy="40" r="1" opacity=".5"/>
  </g>
</svg>
