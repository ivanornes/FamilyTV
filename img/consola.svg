<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset=".55" stop-color="#1636b8"/>
      <stop offset="1" stop-color="#07124f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#9fd3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e3e7f0"/>
      <stop offset="1" stop-color="#b9c0cf"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </linearGradient>
    <radialGradient id="stick" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="680" height="336" fill="url(#bg)"/>
  <!-- haces de luz -->
  <g transform="rotate(-24 340 168)">
    <rect x="-100" y="40" width="900" height="36" fill="url(#ray)"/>
    <rect x="-100" y="230" width="900" height="18" fill="url(#ray)"/>
  </g>
  <rect width="680" height="336" fill="url(#halo)"/>

  <!-- sombra -->
  <ellipse cx="340" cy="292" rx="200" ry="22" fill="#000" opacity=".5" filter="url(#soft)"/>

  <g transform="translate(0 6)">
    <!-- cuerpo -->
    <path d="M226 104 C268 90 412 90 454 104 C512 118 552 182 570 246 C580 286 552 306 526 288
             C500 270 478 236 442 232 L238 232 C202 236 180 270 154 288 C128 306 100 286 110 246
             C128 182 168 118 226 104 Z" fill="url(#shell)"/>
    <!-- canto iluminado -->
    <path d="M226 104 C268 90 412 90 454 104" fill="none" stroke="#ffffff" stroke-width="3" opacity=".9"/>
    <!-- núcleo oscuro central -->
    <path d="M262 112 C300 104 380 104 418 112 L430 186 C420 214 392 226 340 226 C288 226 260 214 250 186 Z" fill="url(#core)"/>
    <!-- panel táctil -->
    <path d="M276 116 C310 110 370 110 404 116 L410 160 C390 168 290 168 270 160 Z" fill="#20242e" stroke="#3a4050" stroke-width="1.5"/>
    <!-- barra de luz -->
    <path d="M270 162 C290 172 390 172 410 162" fill="none" stroke="#5ac8ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M270 162 C290 172 390 172 410 162" fill="none" stroke="#c9f0ff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- cruceta -->
    <g transform="translate(206 160)" fill="#2a2e38">
      <rect x="-9" y="-30" width="18" height="24" rx="5"/>
      <rect x="-9" y="6" width="18" height="24" rx="5"/>
      <rect x="-30" y="-9" width="24" height="18" rx="5"/>
      <rect x="6" y="-9" width="24" height="18" rx="5"/>
    </g>
    <!-- botones de acción (genéricos, de colores) -->
    <g transform="translate(474 160)">
      <circle cx="0" cy="-24" r="11" fill="#2a2e38"/><circle cx="0" cy="-24" r="5" fill="#30d158"/>
      <circle cx="24" cy="0" r="11" fill="#2a2e38"/><circle cx="24" cy="0" r="5" fill="#ff453a"/>
      <circle cx="0" cy="24" r="11" fill="#2a2e38"/><circle cx="0" cy="24" r="5" fill="#64d2ff"/>
      <circle cx="-24" cy="0" r="11" fill="#2a2e38"/><circle cx="-24" cy="0" r="5" fill="#ffd60a"/>
    </g>
    <!-- sticks -->
    <g>
      <circle cx="282" cy="210" r="27" fill="#0b0c10"/>
      <circle cx="282" cy="207" r="22" fill="url(#stick)"/>
      <circle cx="282" cy="207" r="22" fill="none" stroke="#5a6070" stroke-width="1.5" opacity=".7"/>
      <circle cx="398" cy="210" r="27" fill="#0b0c10"/>
      <circle cx="398" cy="207" r="22" fill="url(#stick)"/>
      <circle cx="398" cy="207" r="22" fill="none" stroke="#5a6070" stroke-width="1.5" opacity=".7"/>
    </g>
    <!-- brillo general -->
    <path d="M236 116 C270 106 410 106 444 116 C420 112 260 112 236 122 Z" fill="#ffffff" opacity=".7"/>
  </g>

  <!-- partículas -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="2" opacity=".8"/><circle cx="600" cy="80" r="2.4" opacity=".7"/>
    <circle cx="560" cy="40" r="1.4" opacity=".6"/><circle cx="130" cy="250" r="1.6" opacity=".5"/>
    <circle cx="630" cy="260" r="1.2" opacity=".5"/>
  </g>
</svg>
