<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5cb6"/>
      <stop offset=".55" stop-color="#b3157a"/>
      <stop offset="1" stop-color="#4a0634"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffd1ec" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd1ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c34"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3c8f"/>
      <stop offset=".55" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffc56b"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1b5e"/><stop offset="1" stop-color="#160c33"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b2a83"/><stop offset="1" stop-color="#26154f"/>
    </linearGradient>
    <linearGradient id="screenGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161b"/><stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <clipPath id="screen"><rect x="196" y="40" width="288" height="164" rx="8"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="led" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="680" height="336" fill="url(#bg)"/>
  <rect width="680" height="336" fill="url(#glow)"/>

  <!-- sombras -->
  <ellipse cx="340" cy="298" rx="210" ry="18" fill="#000" opacity=".5" filter="url(#soft)"/>

  <!-- Tele flotante -->
  <g>
    <rect x="186" y="30" width="308" height="184" rx="16" fill="url(#frame)"/>
    <g clip-path="url(#screen)">
      <rect x="196" y="40" width="288" height="164" fill="url(#sky)"/>
      <circle cx="340" cy="150" r="34" fill="#ffe08a"/>
      <circle cx="340" cy="150" r="48" fill="#ffe08a" opacity=".25"/>
      <path d="M196 170 C250 130 300 150 340 160 C390 172 430 128 484 150 L484 204 L196 204 Z" fill="url(#hill2)"/>
      <path d="M196 188 C240 168 290 182 330 186 C380 192 430 170 484 182 L484 204 L196 204 Z" fill="url(#hill1)"/>
      <rect x="196" y="40" width="288" height="164" fill="url(#screenGloss)"/>
      <!-- barra de canal genérica -->
      <rect x="212" y="56" width="62" height="22" rx="11" fill="#000" opacity=".45"/>
      <circle cx="226" cy="67" r="4" fill="#ff453a"/>
      <rect x="236" y="63" width="28" height="8" rx="4" fill="#ffffff" opacity=".85"/>
    </g>
    <rect x="186.75" y="30.75" width="306.5" height="182.5" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/>
  </g>

  <!-- Descodificador delante -->
  <g>
    <!-- tapa -->
    <path d="M178 238 L502 238 L530 256 L150 256 Z" fill="url(#boxTop)"/>
    <path d="M178 238 L502 238" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>
    <!-- frontal -->
    <rect x="150" y="256" width="380" height="40" rx="6" fill="url(#boxFront)"/>
    <!-- display -->
    <rect x="300" y="263" width="80" height="26" rx="4" fill="#0a0203"/>
    <text x="340" y="283" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="20" font-weight="700" fill="#ff3b30" filter="url(#led)" opacity=".9">21:30</text>
    <text x="340" y="283" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="20" font-weight="700" fill="#ff6b61">21:30</text>
    <!-- LEDs -->
    <circle cx="178" cy="276" r="3.5" fill="#30d158" filter="url(#led)"/>
    <circle cx="178" cy="276" r="2.2" fill="#9dffb5"/>
    <!-- rejilla -->
    <g fill="#2a2a32">
      <rect x="420" y="268" width="80" height="3" rx="1.5"/>
      <rect x="420" y="275" width="80" height="3" rx="1.5"/>
      <rect x="420" y="282" width="80" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- ondas de señal -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".55">
    <path d="M560 96 a26 26 0 0 1 0 40" stroke-width="4"/>
    <path d="M576 82 a44 44 0 0 1 0 68" stroke-width="4" opacity=".7"/>
    <path d="M592 68 a62 62 0 0 1 0 96" stroke-width="4" opacity=".45"/>
    <path d="M120 96 a26 26 0 0 0 0 40" stroke-width="4"/>
    <path d="M104 82 a44 44 0 0 0 0 68" stroke-width="4" opacity=".7"/>
    <path d="M88 68 a62 62 0 0 0 0 96" stroke-width="4" opacity=".45"/>
  </g>
</svg>
